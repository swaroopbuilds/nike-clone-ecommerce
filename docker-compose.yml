services:
  mongo:
    image: mongo:latest
    container_name: nike_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: nike_backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/authDB
      PORT: 5000
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./project1
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: nike_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data: